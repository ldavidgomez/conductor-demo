workflow:
  name: demo-changes-requested
  description: "Demo 2: canonical Reviewer rejects a seeded Dev delivery"
  version: "0.1.0"
  entry_point: reviewer
  runtime:
    provider: copilot
    model: auto
agents:
  - name: reviewer
    type: agent
    model: auto
    system_prompt: !file C:/Users/david.gomez/.agentops/agents/reviewer.md
    prompt: |
      Review the canonical Dev delivery in .agentops/tickets/in-progress/TASK-20261006-002-reviewer-changes.
      The task requires ValueError for empty or whitespace-only names. Inspect demo-app/greeting.py.
      Produce a canonical ReviewResult in that ticket directory with ChangesRequested and a concrete finding.
      Do not modify implementation files.
    routes:
      - to: validate_review_result
  - name: validate_review_result
    type: script
    command: python
    args:
      - workflows/canonical/scripts/validate-review-result.py
      - .agentops/tickets/in-progress/TASK-20261006-002-reviewer-changes/review-result.md
    output:
      verdict:
        type: string
        description: "Canonical Reviewer verdict"
      error:
        type: string
        description: "Validation error"
    routes:
      - to: changes_requested_gate
        when: "exit_code == 0 and verdict == 'ChangesRequested'"
      - to: unexpected_result_gate
  - name: changes_requested_gate
    type: human_gate
    prompt: "Reviewer returned ChangesRequested. The evidence remains with the ticket."
    options:
      - label: "Acknowledge and return to Dev"
        value: acknowledge
        route: "$end"
  - name: unexpected_result_gate
    type: human_gate
    prompt: "Unexpected Reviewer result: {{ validate_review_result.output.error }}"
    options:
      - label: "Stop and inspect artifacts"
        value: inspect
        route: "$end"
output:
  verdict: "{{ validate_review_result.output.verdict }}"
